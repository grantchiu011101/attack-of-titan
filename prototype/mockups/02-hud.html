<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup · In-game HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet" />
    <style>
      html,body { margin:0; height:100%; background:#4d5c52; color:#e8eadf; font-family:'Barlow Condensed',sans-serif; }
      body { background: radial-gradient(circle at 30% 40%, #6a7a64 0%, #2c332c 70%); }
      .hud { position:fixed; inset:0; display:flex; justify-content:space-between; padding:28px; }
      .meter { width:220px; margin-bottom:10px; }
      .track { height:8px; background:#0004; border:1px solid #d2ba8255; }
      .track i { display:block; height:100%; background:#6e8b5b; }
      .center { align-self:flex-end; text-align:center; width:40%; }
      .cross { width:14px; height:14px; border:2px solid #fff; transform:rotate(45deg); margin:18vh auto 0; }
      .wave { letter-spacing:.2em; color:#d2ba82; font-family:Cinzel,serif; }
      .mobile { position:fixed; left:24px; bottom:24px; width:110px; height:110px; border-radius:50%; border:1px solid #d2ba8255; }
      .cluster { position:fixed; right:16px; bottom:24px; display:grid; grid-template-columns:64px 64px; gap:8px; }
      .cluster b { display:grid; place-items:center; height:52px; border:1px solid #d2ba8255; background:#9a2b24; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div>
        <div class="meter">HP 78<div class="track"><i style="width:78%"></i></div></div>
        <div class="meter">GAS 41<div class="track"><i style="width:41%;background:#9db86a"></i></div></div>
        <div class="meter">BLADES 22<div class="track"><i style="width:44%;background:#cfd6de"></i></div></div>
      </div>
      <div class="center">
        <div class="wave">WAVE 3</div>
        <div>NAPE CUT · 186</div>
        <div class="cross"></div>
      </div>
      <div style="text-align:right">
        <div>KILLS <b style="font-size:28px">11</b></div>
        <div>SCORE <b style="font-size:28px">1640</b></div>
        <p>Nape cut · 186</p>
        <p>Nape cut · 120</p>
      </div>
    </div>
    <div class="mobile"></div>
    <div class="cluster"><b>Q</b><b>E</b><b>GAS</b><b>JMP</b><b style="grid-column:span 2">SLASH</b></div>
  </body>
</html>
